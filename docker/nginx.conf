server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Hide server version from all responses
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security Headers ───────────────────────────────────────────────────────
    # Prevent MIME-type sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;

    # Disallow framing from other origins (clickjacking protection)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Legacy XSS filter (belt-and-suspenders; CSP below is the real guard)
    add_header X-XSS-Protection "1; mode=block" always;

    # Only send origin on same-site navigations; suppress on cross-site downgrade
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — static documentation site: no inline scripts needed
    # Allows: self + specific CDN fonts/icons; blocks eval/inline-script execution
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS — 1 year; tell browsers to always use HTTPS (effective after first visit)
    # NOTE: this header only matters when served over TLS. The reverse proxy (Caddy/Nginx upstream)
    # is responsible for TLS termination. This header is pre-set here so it is forwarded correctly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable browser features not needed by a static documentation site
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ── Shell installer scripts — served as plain text, never cached ───────────
    location ~* \.sh$ {
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Re-apply security headers (add_header inheritance only works at same block level)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ── CSS & JS assets — revalidate with server to prevent stale cache ───────
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ── Media & font assets — safe standard cache ────────────────────────────
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ── Clean URL routing for static SSG (HTML never cached statically) ────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri $uri.html $uri/index.html $uri/ /index.html =404;
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

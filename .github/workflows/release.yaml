name: Release Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Multi-Track Release Pipeline (ADR-R7P3K)
# Tracks: lts, stable, pre-release (rc, beta, alpha), experimental, dev
#
#   classify       → derive version/track from the tag (or dispatch inputs)
#   quality-gate   → the exact CI gate contract (ci.yaml)
#   artifacts      → reproducible build, SBOM, SHA256SUMS, provenance,
#                    per-platform smoke tests, publish, post-publish verify
#                    (release-artifacts.yaml, shared with nightly.yaml)
# A release is never published unless every gate and every target succeeds.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'             # stable (GA)
      - 'v[0-9]+.[0-9]+.[0-9]+-lts*'        # lts
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'        # rc
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*'      # beta
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.*'     # alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-exp.*'       # experimental tag
      - 'v[0-9]+.[0-9]+.[0-9]+-dev.*'       # dev tag
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track to build and publish'
        required: true
        type: choice
        default: 'dev'
        options:
          - 'lts'
          - 'stable'
          - 'rc'
          - 'beta'
          - 'alpha'
          - 'experimental'
          - 'dev'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify Release Track
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      track: ${{ steps.meta.outputs.track }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse Trigger & Track
        id: meta
        env:
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          # Canonical version SSOT (docs/foundation/release-and-compatibility.md §1).
          BASE="$(sed -n 's/^var CurrentVersion = MustParseVersion("\(.*\)")$/\1/p' pkg/version/version.go)"
          if [ -z "${BASE}" ]; then
            echo "::error::cannot read CurrentVersion from pkg/version/version.go"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            case "${VER}" in
              *-lts*)   TRACK="lts";          PRERELEASE="false" ;;
              *-rc*)    TRACK="rc";           PRERELEASE="true" ;;
              *-beta*)  TRACK="beta";         PRERELEASE="true" ;;
              *-alpha*) TRACK="alpha";        PRERELEASE="true" ;;
              *-exp*)   TRACK="experimental"; PRERELEASE="true" ;;
              *-dev*)   TRACK="dev";          PRERELEASE="true" ;;
              *)        TRACK="stable";       PRERELEASE="false" ;;
            esac
            TAG_BASE="${VER#v}"; TAG_BASE="${TAG_BASE%%-*}"
            if [ "${TAG_BASE}" != "${BASE}" ]; then
              echo "::warning::tag ${VER} does not match pkg/version CurrentVersion ${BASE}"
            fi
          else
            TRACK="${INPUT_TRACK:-dev}"
            VER="v${BASE}-${TRACK}.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            if [ "${TRACK}" = "stable" ] || [ "${TRACK}" = "lts" ]; then
              PRERELEASE="false"
            else
              PRERELEASE="true"
            fi
          fi
          {
            echo "track=${TRACK}"
            echo "version=${VER}"
            echo "is_prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release Track: ${TRACK} | Version: ${VER} | Prerelease: ${PRERELEASE}"

  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  artifacts:
    name: Artifacts
    needs: [classify, quality-gate]
    uses: ./.github/workflows/release-artifacts.yaml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.classify.outputs.version }}
      channel: ${{ needs.classify.outputs.track }}
      prerelease: ${{ needs.classify.outputs.is_prerelease == 'true' }}
      publish: true

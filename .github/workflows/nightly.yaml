name: Nightly Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Nightly Build Pipeline (ADR-R7P3K)
# Daily bleeding-edge build from main. Uses the same quality gates (ci.yaml)
# and the same artifact path (release-artifacts.yaml) as stable releases;
# only the version and the `nightly` channel metadata differ.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'                      # Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, attest, and smoke-test without publishing a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-krewire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate Version Tag
        id: meta
        run: |
          # Nightlies precede the next minor of the canonical version SSOT.
          BASE="$(sed -n 's/^var CurrentVersion = MustParseVersion("\(.*\)")$/\1/p' version/version.go)"
          if [ -z "${BASE}" ]; then
            echo "::error::cannot read CurrentVersion from version/version.go"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR _ <<< "${BASE}"
          VER="v${MAJOR}.$((MINOR + 1)).0-nightly.$(date -u +%Y%m%d)"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Generated Nightly Version: ${VER}"

  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  artifacts:
    name: Artifacts
    needs: [classify, quality-gate]
    uses: ./.github/workflows/release-artifacts.yaml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.classify.outputs.version }}
      channel: nightly
      prerelease: true
      publish: ${{ inputs.dry_run != true }}

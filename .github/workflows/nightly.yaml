name: Nightly Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Nightly Build Pipeline (ADR-R7P3K)
# Automated bleeding-edge daily release for kiw CLI & Core libraries
# Triggered daily on schedule from branch 'main' or via manual dispatch
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'                      # Nightly build at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run compilation without publishing release assets'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-krewire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      track: nightly
      is_prerelease: "true"
    steps:
      - name: Generate Version Tag
        id: meta
        run: |
          DATE_TAG="$(date -u +%Y%m%d)"
          VER="v0.3.0-nightly.${DATE_TAG}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Generated Nightly Version: ${VER}"

  quality-gate:
    name: Quality Gate & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Formatting Check
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Static Analysis
        run: go vet ./...

      - name: Layering & Peer Decoupling Tests
        run: go test -v ./layering_test.go

      - name: Unit & Integration Tests
        run: go test -v ./...

      - name: .kiw Conformance Suite (Runtime & Hydration)
        run: go test -v ./pkg/runtime/conformance/...

      - name: Pure-Go Compilation Invariant
        run: CGO_ENABLED=0 go build ./...

  publish-github-release:
    name: Publish Nightly Release Artifacts
    needs: [classify, quality-gate]
    runs-on: ubuntu-latest
    if: inputs.dry_run != true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: notes
        run: |
          VER="${{ needs.classify.outputs.version }}"
          
          cat << EOF > release_notes.md
          ## Krewire Core Libraries — ${VER} (Nightly Build)
          
          **Release Track**: \`nightly\`
          **Commit**: \`${{ github.sha }}\`
          **Build Date**: \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`
          
          Foundational modular Go libraries (\`github.com/krewire/krewire/pkg/...\`).
          EOF

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.version }}
          name: Krewire ${{ needs.classify.outputs.version }} [nightly]
          body_path: release_notes.md
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

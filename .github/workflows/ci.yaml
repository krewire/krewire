name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Krewire core quality-gate contract (docs/guides/testing-and-qa.md §6).
# Every gate is its own job so a failure names the gate that failed.
# Branch protection should require the aggregate `ci-ok` check; the per-gate
# check names below are stable and documented as well.
# Runs on every pull request (no path filter, so required checks always
# report), on pushes to main, in the merge queue, and as a reusable workflow
# from the release and nightly pipelines. No secrets are used.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-krewire-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local        # test exactly the toolchain setup-go installed
  GO_VERSION: "1.27.3"

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt -l .
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error title=gofmt::unformatted files (run gofmt -w):"
            echo "${unformatted}"
            exit 1
          fi

  mod-tidy:
    name: mod-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: Verify workspace and module manifests
        run: |
          for mod in $(find . -maxdepth 3 -name "go.mod" -not -path "*/.*" -exec dirname {} \; | sort); do
            (cd "$mod" && go mod verify)
          done
          git diff --exit-code go.work

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: go vet across all constituent modules
        run: |
          TARGETS=$(find . -maxdepth 3 -name "go.mod" -not -path "*/.*" -exec dirname {} \; | sed 's|^\./||' | awk '{print "./" $0 "/..."}' | sort | tr '\n' ' ')
          go vet ${TARGETS}

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: Layering, peer-decoupling, and platform guards
        run: go test -count=1 -v ./conformance ./errs ./model

  ai-native:
    name: ai-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: Toolchain contract conformance (reference engine, no LLM credentials)
        env:
          KREW_ENGINE: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          go test -count=1 -v \
            -run 'TestReferenceEngineConforms|TestSpawnedEngineProcess|TestEndToEndFlow' \
            ./toolchain/fakeengine ./toolchain/adapter ./toolchain/workflow

  test:
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [min, stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go == 'min' && env.GO_VERSION || 'stable' }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: go test across all constituent modules (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: |
          TARGETS=$(find . -maxdepth 3 -name "go.mod" -not -path "*/.*" -exec dirname {} \; | sed 's|^\./||' | awk '{print "./" $0 "/..."}' | sort | tr '\n' ' ')
          go test -count=1 ${TARGETS}

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: go test -race across all constituent modules
        env:
          CGO_ENABLED: "1"   # the race detector requires cgo; only this gate enables it
        run: |
          TARGETS=$(find . -maxdepth 3 -name "go.mod" -not -path "*/.*" -exec dirname {} \; | sed 's|^\./||' | awk '{print "./" $0 "/..."}' | sort | tr '\n' ' ')
          go test -race -count=1 ${TARGETS}

  build-purego:
    name: build-purego
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: CGO_ENABLED=0 go build across all modules (clean checkout)
        env:
          CGO_ENABLED: "0"
        run: |
          TARGETS=$(find . -maxdepth 3 -name "go.mod" -not -path "*/.*" -exec dirname {} \; | sed 's|^\./||' | awk '{print "./" $0 "/..."}' | sort | tr '\n' ' ')
          go build ${TARGETS}

  build-wasm:
    name: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: GOOS=js GOARCH=wasm go build ./runtime/...
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: go build -trimpath ./runtime/...

  release-snapshot:
    name: release-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Provision Sibling Dependencies
        run: |
          if [ ! -d "../hub" ]; then
            git clone --depth 1 https://github.com/krewire/hub.git ../hub
          fi
          if [ ! -d "../ui" ]; then
            git clone --depth 1 https://github.com/krewire/ui.git ../ui
          fi
      - name: Build every release target
        run: .github/scripts/build-release.sh v0.0.0-ci "dev" "${RUNNER_TEMP}/a"
      - name: Rebuild and compare (bit-for-bit reproducibility)
        run: |
          .github/scripts/build-release.sh v0.0.0-ci "dev" "${RUNNER_TEMP}/b"
          if ! diff "${RUNNER_TEMP}/a/SHA256SUMS" "${RUNNER_TEMP}/b/SHA256SUMS"; then
            echo "::error title=reproducibility::two builds of the same commit differ"
            exit 1
          fi
      - name: Smoke test linux/amd64 binary
        run: |
          bin="${RUNNER_TEMP}/a/ai_v0.0.0-ci_linux_amd64"
          if [ -f "${bin}" ]; then
            (cd "${RUNNER_TEMP}/a" && sha256sum -c --ignore-missing SHA256SUMS)
            "${bin}" --version | tee version.txt
            grep -q "v0.0.0-ci" version.txt
            "${bin}" --help >/dev/null
          else
            echo "krewire is a pure domain library monorepo without standalone binaries."
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [gofmt, mod-tidy, vet, architecture, ai-native, test, race, build-purego, build-wasm, release-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All quality gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error title=ci-ok::at least one quality gate did not succeed"
              exit 1
            fi
          done

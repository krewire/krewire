name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node (Tailwind plugin)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw
        run: GOPROXY=direct go install github.com/krewire/kiw/cmd/kiw@v0.3.3

      - name: Build site
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          kiw build
          test -f .krewire/build/index.html
          ls .krewire/build/docs/

      - name: Publish to gh-pages (project site)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/krewire/krewire.git
          kiw deploy --target gh-pages --branch gh-pages --remote origin \
            --message "deploy: site from ${GITHUB_SHA::7}"

      - name: Publish to krewire.github.io (root site)
        # Requires PAT with repo scope stored as PAGES_PAT (GITHUB_TOKEN cannot push cross-repo)
        continue-on-error: true
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          TOKEN="${PAGES_PAT:-$GITHUB_TOKEN}"
          if [ -z "$TOKEN" ]; then echo "No token available, skipping root deploy"; exit 0; fi
          git remote add io https://x-access-token:${TOKEN}@github.com/krewire/krewire.github.io.git 2>/dev/null || git remote set-url io https://x-access-token:${TOKEN}@github.com/krewire/krewire.github.io.git
          kiw deploy --target gh-pages --branch gh-pages --remote io \
            --message "deploy: site from krewire/krewire@${GITHUB_SHA::7}" || echo "Root deploy failed (needs PAGES_PAT with repo access) - subpath deploy already succeeded"

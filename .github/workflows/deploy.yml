name: Deploy to krewire.github.io

on:
  push:
    branches: [gh-deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built site from gh-deploy
        uses: actions/checkout@v4
        with:
          repository: krewire/krewire
          ref: gh-deploy
          path: site-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout deploy target (krewire/krewire.github.io gh-pages)
        uses: actions/checkout@v4
        with:
          repository: krewire/krewire.github.io
          path: deploy
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy gh-deploy → krewire.github.io gh-pages (root)
        run: |
          # site-src is the built site at root (gh-deploy branch)
          cp -r site-src/. deploy/
          rm -rf deploy/.git
          touch deploy/.nojekyll
          cd deploy
          # deploy was checked out via actions/checkout with its own .git for gh-pages;
          # we just overwrote it, so re-init and push
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/krewire/krewire.github.io.git 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "deploy: from krewire/krewire@${{ github.sha }} (gh-deploy) [skip ci]"
          git push origin HEAD:gh-pages --force

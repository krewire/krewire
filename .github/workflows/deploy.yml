name: Deploy to krewire.github.io

on:
  push:
    branches: [gh-deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built site from gh-deploy
        uses: actions/checkout@v4
        with:
          repository: krewire/krewire
          ref: gh-deploy
          path: site-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to krewire.github.io (gh-pages, root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          # For cross-repo deploy, GITHUB_TOKEN is scoped to source repo only.
          # Add a PAT with repo scope as `PAT` secret for org push, else fallback
          # will attempt with GITHUB_TOKEN (may fail on org repos).
          personal_token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          external_repository: krewire/krewire.github.io
          publish_branch: gh-pages
          publish_dir: site-src
          cname: ""
          enable_jekyll: false

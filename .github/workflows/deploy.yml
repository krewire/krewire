name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node (Tailwind plugin)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw
        run: GOPROXY=direct go install github.com/krewire/kiw/cmd/kiw@v0.3.2

      - name: Build site
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          kiw build
          test -f .krewire/build/index.html
          ls .krewire/build/docs/

      - name: Publish to gh-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          kiw deploy --target gh-pages --branch gh-deploy --remote origin \
            --message "deploy: site from ${GITHUB_SHA::7}"

name: Deploy to krewire.github.io

on:
  push:
    branches: [gh-deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (gh-deploy is fast-forward from main)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install kiw
        run: GOPROXY=direct go install github.com/krewire/kiw/cmd/kiw@v0.2.0

      - name: Build site
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          kiw build
          ls -R site
          test -f site/index.html

      - name: Deploy to krewire.github.io (gh-pages, root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.KREWIRE_GH_PAGES_PAT || secrets.GITHUB_TOKEN }}
          external_repository: krewire/krewire.github.io
          publish_branch: gh-pages
          publish_dir: site
          cname: ""
          enable_jekyll: false

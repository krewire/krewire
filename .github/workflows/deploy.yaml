name: Deploy to krewire.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the static site
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Setup Node (Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw CLI
        run: |
          # Build kiw from the ecosystem's own sources rather than installing a
          # published tag. `go install ...@v0.1.0` would resolve framework/libs/
          # mdbind from the module proxy, i.e. the released code, which does not
          # contain the site fixes on this branch. Cloning the modules and
          # joining them with a go.work pins every dependency to this commit.
          for repo in libs framework kiw mdbind hub ship forge boost; do
            git clone --depth 1 --branch main "https://github.com/krewire/${repo}.git" "${RUNNER_TEMP}/krewire/${repo}"
          done
          cd "${RUNNER_TEMP}/krewire"
          go work init
          go work use ./libs ./framework ./kiw ./mdbind ./hub ./ship ./forge ./boost
          go work sync
          go build -o "${RUNNER_TEMP}/bin/kiw" ./kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify kiw installation
        run: kiw version

      - name: Build static site
        run: |
          # `kiw build` emits the complete site, including the shared asset plan:
          # every page already links style.css → tailwind.css → forge.css →
          # theme.css → mdbind.css and the site scripts, in cascade order with
          # ?v=<version> cache busting. No post-processing step may reorder or
          # re-link those assets.
          kiw build

      - name: Verify asset injection
        run: |
          cd .krewire/build
          fail=0
          # The cascade order must hold on every page, landing and docs alike.
          for page in index.html docs.html getting-started/configuration.html; do
            test -f "$page" || { echo "✗ missing page $page"; fail=1; continue; }
            order=$(grep -o 'href="/assets/[a-z]*\.css[^"]*"' "$page" | sed 's|.*assets/||;s|?.*"||' | tr '\n' ' ')
            if [ "$order" != "style.css tailwind.css forge.css theme.css mdbind.css " ]; then
              echo "✗ $page asset order = $order"
              fail=1
            fi
            # Every injected asset must be cache-busted, or a reader keeps a
            # stale stylesheet on one page family and a fresh one on another.
            if grep -q 'href="/assets/[a-z]*\.css"' "$page"; then
              echo "✗ $page has an unversioned stylesheet"
              fail=1
            fi
            # The reader script must come from the build, not from a sed patch.
            grep -q '<script src="/assets/app.js?v=' "$page" || { echo "✗ $page missing app.js"; fail=1; }
            grep -q '<script src="/assets/docs.js?v=' "$page" || { echo "✗ $page missing docs.js"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "✗ asset injection verification failed"; exit 1; }
          echo "✓ Asset order and cache busting verified on landing and docs pages."

      - name: Verify build outputs
        run: |
          test -f .krewire/build/index.html
          test -d .krewire/build/assets
          test -f .krewire/build/assets/app.js
          test -f .krewire/build/getting-started.html
          test -f .krewire/build/scripts/install.sh
          # Verify install.sh is plain text (not binary) — content integrity check
          file .krewire/build/scripts/install.sh | grep -q "shell script\|text"
          echo "✓ All required build outputs present."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker image & deploy to VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://krewire.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: krewire-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (with integrity checksum)
        run: |
          docker save krewire-web:${{ github.sha }} | gzip > /tmp/krewire-web.tar.gz
          sha256sum /tmp/krewire-web.tar.gz > /tmp/krewire-web.tar.gz.sha256
          echo "Image checksum:"
          cat /tmp/krewire-web.tar.gz.sha256

      - name: Configure SSH (strict host key verification)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write known_hosts fingerprint — provided as a repository secret.
          # Obtain with: ssh-keyscan <host> and store as VPS_KNOWN_HOSTS secret.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy Docker image to VPS (with checksum)
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              /tmp/krewire-web.tar.gz \
              /tmp/krewire-web.tar.gz.sha256 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy on VPS
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s "${{ github.sha }}" << 'REMOTE'
            set -euo pipefail
            SHA="$1"

            echo "▶ Verifying image checksum on VPS..."
            sha256sum -c /tmp/krewire-web.tar.gz.sha256 \
              || { echo "✗ Checksum mismatch — aborting deploy."; exit 1; }
            echo "✓ Checksum verified."

            echo "▶ Loading Docker image..."
            docker load < /tmp/krewire-web.tar.gz

            echo "▶ Tagging image..."
            docker tag "krewire-web:${SHA}" krewire-web:latest

            echo "▶ Saving previous image tag for rollback..."
            PREV_ID="$(docker inspect --format='{{.Id}}' krewire-web:previous 2>/dev/null || true)"

            echo "▶ Restarting container..."
            cd ~/workspace/krewire/krewire
            docker compose up -d --no-build

            echo "▶ Waiting for container to become healthy..."
            HEALTHY=false
            for i in $(seq 1 20); do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' krewire-web 2>/dev/null || echo 'unknown')"
              printf "  [%2d/20] Health: %s\n" "$i" "$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ Container is unhealthy after startup — initiating rollback."
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "✗ Health check failed — rolling back to previous image."
              if [ -n "$PREV_ID" ]; then
                docker tag "$PREV_ID" krewire-web:latest
                docker compose up -d --no-build
                echo "✓ Rollback complete."
              else
                echo "⚠ No previous image available for rollback."
              fi
              exit 1
            fi

            echo "✓ Container is healthy."

            echo "▶ Tagging deployed image as :previous for future rollback..."
            docker tag krewire-web:latest krewire-web:previous

            echo "▶ Cleaning up transfer files..."
            rm -f /tmp/krewire-web.tar.gz /tmp/krewire-web.tar.gz.sha256

            echo "▶ Pruning dangling images (not removing tagged images)..."
            docker image prune -f --filter "label!=com.krewire.keep=true"

            echo "✓ Deployment complete."
          REMOTE

      - name: Smoke test — verify live site
        run: |
          echo "▶ Smoke testing https://krewire.com ..."
          sleep 5
          HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://krewire.com/ 2>/dev/null || true)"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Live site returned HTTP ${HTTP_CODE}."
          else
            echo "✗ Smoke test failed: HTTP ${HTTP_CODE} from https://krewire.com"
            exit 1
          fi
          # Verify the installer script is reachable and is plain text
          SH_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/scripts/install.sh 2>/dev/null || true)"
          if [ "${SH_CODE}" = "200" ]; then
            echo "✓ install.sh reachable (HTTP ${SH_CODE})."
          else
            echo "⚠ install.sh returned HTTP ${SH_CODE} — check nginx routing."
            exit 1
          fi
          echo "✓ All smoke tests passed."

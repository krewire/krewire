name: Deploy to krewire.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the static site
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Setup Node (Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install kiw CLI
        run: GOPROXY=direct go install github.com/krewire/kiw/cmd/kiw@v0.1.0

      - name: Build static site
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          kiw build
          # Apply modern documentation stylesheet & interactive reader scripts
          cp public/assets/mdbind.css .krewire/build/assets/mdbind.css
          cp public/assets/docs.js .krewire/build/assets/docs.js
          cp public/assets/app.js .krewire/build/assets/app.js
          sed -i 's|</body>|<script src="/assets/docs.js"></script></body>|g' .krewire/build/docs/*.html .krewire/build/docs.html
          find .krewire/build -name "*.html" -exec sed -i 's|</head>|<script src="/assets/app.js"></script></head>|g' {} +
          # Verify required outputs exist
          test -f .krewire/build/index.html
          test -d .krewire/build/assets
          test -f .krewire/build/assets/app.js
          test -f .krewire/build/docs/getting-started.html
          test -f .krewire/build/scripts/install.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .krewire/build
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker image & deploy to VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://krewire.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: .krewire/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: krewire-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image as tar
        run: docker save krewire-web:${{ github.sha }} | gzip > /tmp/krewire-web.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Docker image to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              /tmp/krewire-web.tar.gz \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/krewire-web.tar.gz

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            echo "▶ Loading Docker image..."
            docker load < /tmp/krewire-web.tar.gz

            echo "▶ Tagging image as :latest..."
            docker tag krewire-web:${{ github.sha }} krewire-web:latest

            echo "▶ Restarting container..."
            cd ~/workspace/krewire/krewire
            docker compose up -d --no-build

            echo "▶ Waiting for container healthcheck..."
            for i in $(seq 1 15); do
              status=$(docker inspect --format='{{.State.Health.Status}}' krewire-web 2>/dev/null || echo "unknown")
              echo "  [poll $i/15] Health: $status"
              if [ "$status" = "healthy" ]; then
                echo "✓ Container is healthy!"
                break
              fi
              sleep 2
            done

            echo "▶ Cleaning up..."
            docker image prune -f
            rm -f /tmp/krewire-web.tar.gz

            echo "✓ Deployment complete."
          ENDSSH

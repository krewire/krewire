name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pure-Go Test (${{ matrix.os }} - Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.27.x']
    steps:
      - name: Checkout krewire
        uses: actions/checkout@v4
        with:
          path: krewire

      - name: Checkout mdbind sibling
        uses: actions/checkout@v4
        with:
          repository: krewire/mdbind
          path: mdbind

      - name: Checkout krew sibling
        uses: actions/checkout@v4
        with:
          repository: krewire/krew
          path: krew

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Check Formatting
        working-directory: krewire
        run: |
          test -z "$(gofmt -l .)"

      - name: Verify Module Checksums (go mod verify)
        working-directory: krewire
        run: |
          go mod verify

      - name: Vet All Packages
        working-directory: krewire
        run: |
          go vet ./...

      - name: Pure Go Tests (CGO_ENABLED=0)
        working-directory: krewire
        env:
          CGO_ENABLED: '0'
        run: |
          go test -v ./...

      - name: Verify Layer 0 Invariants
        working-directory: krewire
        run: |
          go test -v -run "TestKWL_L0_" ./pkg/model/... ./pkg/errs/... ./pkg/version/... ./tools/kiw/internal/buildinfo/... ./tools/kiw/internal/gomod/...

      - name: Build kiw CLI Binary (Deterministic & Reproducible)
        working-directory: krewire
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/kiw ./tools/kiw/cmd/kiw

  cross-compile:
    name: Cross-Compilation Matrix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout krewire
        uses: actions/checkout@v4
        with:
          path: krewire

      - name: Checkout mdbind sibling
        uses: actions/checkout@v4
        with:
          repository: krewire/mdbind
          path: mdbind

      - name: Checkout krew sibling
        uses: actions/checkout@v4
        with:
          repository: krewire/krew
          path: krew

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Cross-compile kiw for macOS (darwin/arm64)
        working-directory: krewire
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/kiw-darwin-arm64 ./tools/kiw/cmd/kiw

      - name: Cross-compile kiw for Windows (windows/amd64)
        working-directory: krewire
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/kiw-windows-amd64.exe ./tools/kiw/cmd/kiw

      - name: Verify WebAssembly Compilation (js/wasm)
        working-directory: krewire
        env:
          CGO_ENABLED: '0'
          GOOS: js
          GOARCH: wasm
        run: |
          go build ./pkg/runtime/...
